  const D = {topic:topic || null, combo:0, comboMax:0, challenge: mode === 'normal' && !placement && teen() && !!ME.challenge, subj, mode, placement, i:0, n:10, results:[], streakOK:0, streakNo:0, coins:0, fixOK:0, levelStart:ME.levels[subj], used:[], why:false, rewards: mode === 'boss' || !coreDone(), phase:'q', q:null, lastGen:null};

  S.drill = D; S.view = 'drill'; nextQ();
}
function placementLevel(i){ const g = ME.grade; const seq = g <= 5 ? [g - 1, g - 1, g - 1, g - 1, g, g, g, g, g, g] : [g - 1, g - 1, g - 1, g, g, g, g, g + 1, g + 1, g + 1]; return clamp(seq[i], 3, 12); }
/* stretch questions only when the learner is doing well in this session */
function stretchOK(D){ const ok = D.results.filter(r => r === 'ok').length; return D.i >= 4 && ok / D.i >= .8; }
function curLevel(D, subj){ return D.placement ? placementLevel(D.i) + (subj === 'math' && ME.grade > 5 ? 1 / 3 : 0) : ME.levels[subj]; }

function makeMath(D, forceLv){
  let lv = forceLv || curLevel(D, 'math');
  if (!D.placement && !forceLv && D.i === 5 && !D.why && !D.topic){
    const W = P(WHY[bandOf(lv)]); const ord = SH(W.opts.map((_, i) => i));
    return {kind:'mcq', why:true, subj:'math', topic:'reasoning', lv, q:W.q, opts:ord.map(i => W.opts[i]), a:ord.indexOf(W.a), explain:'Reasoning means explaining why, not only what. ' + W.opts[W.a]};
  }
  let key, stage = Math.floor(lv), tier = tierOf(lv);
  if (D.challenge){ if (tier < 3) tier++; else if (stage < 12){ stage++; tier = 1; } }
  if (!D.placement && !forceLv){
    const r = Math.random(), due = dueTopics('math').filter(t => t.gen);
    if (r < .2 && due.length) key = P(due).gen;
    else if (r < .3 && stretchOK(D) && tier === 3 && stage < 12){ stage++; tier = 1; }
    else if (r < .4 && stage > 3){ stage--; tier = 3; }
  }
  if (!key && D.topic){ const c = []; for (const s of [stage - 1, stage, stage + 1]){ const pool = POOLS2[clamp(s, 3, 12)]; if (!pool) continue; for (const e of pool){ const [k, t] = e.split(':'); if (topicOfGen(k) === D.topic && +t <= tier + (s < stage ? 3 : 0)) c.push(k); } } if (c.length) key = P(c); }

function bankFor(subj, lv){ return (subj === 'eng' ? ESL : SCI)[bandOf(lv)]; }
function prepBank(item, subj, lv){
  const q = Object.assign({}, item, {kind:item.type, subj, lv, bank:true});
  if (item.opts){ const ord = SH(item.opts.map((_, i) => i)); q.opts = ord.map(i => item.opts[i]); q.a = ord.indexOf(item.a); }
  if (item.type === 'order'){ q.pool = SH(item.words.map((w, i) => ({w, i}))); if (q.pool.every((p, j) => p.i === j)) q.pool.reverse(); q.picked = []; }
  if (item.type === 'sort'){ q.pick = {}; }
  if (item.type === 'poe'){ q.stage = 0; }
  return q;
}
function makeBank(D, subj, forceLv, topic){
  let lv = forceLv || curLevel(D, subj);
  if (!D.placement && !forceLv){ const r = Math.random(); if (r < .1 && stretchOK(D)) lv = clamp(Math.floor(lv) + 2, 3, 12); else if (r < .25) lv = clamp(Math.floor(lv) - 2, 3, 12); }
  const bank = bankFor(subj, lv); const seen = ME.seen[subj] || [];
  let cands = bank.filter(x => !D.used.includes(x.id) && (!topic || x.topic === topic));
  const fresh = cands.filter(x => !seen.includes(x.id)); if (fresh.length) cands = fresh;
  if (!cands.length) cands = bank.filter(x => !D.used.includes(x.id));
  if (!cands.length) cands = bank;
  const item = P(cands); D.used.push(item.id); seen.push(item.id); while (seen.length > Math.min(30, bank.length - 2)) seen.shift(); ME.seen[subj] = seen;

function fromRef(ref){

  const bankAll = (ref.subj === 'eng' ? ESL : SCI); for (const b in bankAll){ const it = bankAll[b].find(x => x.id === ref.id); if (it){ const q = prepBank(it, ref.subj, ref.lv); q.ref = ref; return q; } }

/* timer */
function vTimer(){
  const T = S.timer; if (!T) return vHome();
  const el = T.mode === 'focus' ? Math.max(0, T.total - T.elapsed) : T.elapsed;
  const mm = String(Math.floor(el / 60)).padStart(2, '0'), ss = String(el % 60).padStart(2, '0');
  const frac = T.mode === 'focus' ? T.elapsed / T.total : (T.elapsed % 3600) / 3600;
  const C = 2 * Math.PI * 96;
  return `<div class="stack">${topbar(T.mode === 'focus' ? L('Focus Timer','Timer Fokus') : L('Task timer','Timer tugas'), T.mode === 'focus' ? 'practice' : 'home')}
  ${T.mode === 'task' ? `<p class="center"><b>${esc(T.label)}</b> · ${L('your guess','tebakanmu')} ${T.est}′</p>` : ''}
  ${T.mode === 'focus' && !T.running && !T.elapsed ? `<div class="row" style="justify-content:center">${[10,15,20,25].map(m => `<button class="chip ${T.total === m * 60 ? 'on' : ''}" data-a="setFocus" data-v="${m}">${m} ${L('min','menit')}</button>`).join('')}</div>` : ''}
  <div class="ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="96" fill="none" stroke="var(--surface2)" stroke-width="14"/><circle cx="110" cy="110" r="96" fill="none" stroke="var(--home)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}" transform="rotate(-90 110 110)"/></svg><div class="inner"><div class="timer-face" id="tface">${mm}:${ss}</div></div></div>
  <div style="width:130px;margin:0 auto">${petSVG(ME.pet, ME.stage, 'ok')}</div>
  <p class="center small muted">${T.mode === 'focus' ? L(`${esc(ME.petName)} is reading quietly with you.`, `${esc(ME.petName)} ikut membaca dengan tenang.`) : L('Stop the timer when the task is finished.','Hentikan timer saat tugas selesai.')}</p>
  <div class="row" style="justify-content:center">${T.running ? `<button class="btn warn" data-a="timerStop">${T.mode === 'focus' ? L('Stop','Berhenti') : L('I finished','Selesai')}</button><button class="btn ghost" data-a="timerPause">${L('Pause','Jeda')}</button>` : `<button class="btn" data-a="timerStart">${T.elapsed ? L('Resume','Lanjutkan') : L('Start','Mulai')}</button>${T.elapsed ? `<button class="btn ghost" data-a="timerStop">${T.mode === 'focus' ? L('End','Akhiri') : L('I finished','Selesai')}</button>` : ''}`}</div></div>`;
}

/* growth */
function accSeries(subj){
  const days = weekDays(); const out = [];
  for (let w = 3; w >= 0; w--){ let n = 0, c = 0; for (let i = 0; i < 7; i++){ const k = addDays(days[0], -7 * w + i); const r = ME.days[k] && ME.days[k].drills[subj]; if (r){ n += r.n; c += r.c; } } out.push(n ? Math.round(c / n * 100) : null); }
  return out;
}
function chartAcc(){
  const S3 = ['math','eng','sci'], cols = ['var(--sun)','var(--leaf)','var(--sky)'];
  const data = S3.map(accSeries); const W = 320, H = 150, x0 = 34, y0 = 12, ch = 100, gw = (W - x0 - 8) / 4;
  let g = '';
  [0, 50, 100].forEach(v => { const y = y0 + ch - v; g += `<line x1="${x0}" x2="${W - 6}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${x0 - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="var(--ink2)">${v}%</text>`; });
  for (let w = 0; w < 4; w++){ data.forEach((ser, s) => { const v = ser[w]; const bw = 14, x = x0 + w * gw + 10 + s * (bw + 4); if (v != null) g += `<rect x="${x}" y="${y0 + ch - v}" width="${bw}" height="${Math.max(1, v)}" rx="3" fill="${cols[s]}"><title>${v}%</title></rect>`; else g += `<rect x="${x}" y="${y0 + ch - 2}" width="${bw}" height="2" fill="var(--line)"/>`; });
    g += `<text x="${x0 + w * gw + gw / 2}" y="${H - 18}" text-anchor="middle" font-size="10" fill="var(--ink2)">${w === 3 ? L('this wk','mg ini') : (3 - w) + L(' wk ago',' mg lalu')}</text>`; }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="accuracy by week">${g}</svg></div><div class="row small">${S3.map((s, i) => `<span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:${cols[i]};display:inline-block"></i>${tx(SUBJ[s])}</span>`).join('')}</div>`;
}
function planStats(){
  let n = 0, done = 0, err = [], days = 0;
  for (let i = 0; i < 14; i++){ const d = ME.days[addDays(dkey(), -i)]; if (!d || !d.plan.length) continue; days++; d.plan.forEach(p => { n++; if (p.done) done++; if (p.actual) err.push(Math.abs(p.actual - p.est)); }); }

}

function weekSummary(k = weekKey()){
  const days = weekDays(); let n = 0, c = 0, sessions = 0, active = 0, plans = 0, plansDone = 0, reviews = 0;
  const subj = {math:[0,0], eng:[0,0], sci:[0,0]};

  const w = ME.weeks[k] || {};
  return {active, sessions, n, c, subj, plans, plansDone, reviews, ef:w.ef, quest:w.quest, enq:w.enq};
}

function fbAvailable(){ return typeof window !== 'undefined' && window.firebase && firebase.initializeApp; }
function fbStart(){
  if (SYNC.starting) return SYNC.starting;

    if (!fbAvailable()) return false;
    try { if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG); SYNC.auth = firebase.auth(); SYNC.db = firebase.firestore();
      await new Promise(res => { const u = SYNC.auth.onAuthStateChanged(() => { u(); res(); }); });

}

async function syncNow(){
  if (!ME || !ME.classCode) return;
  try { const u = await kidAuth(); if (!u) return;
    if (!ME.syncSecret){ ME.syncSecret = rid(16); save(); }
    await SYNC.db.collection('students').doc(ME.id).set(studentDoc(), {merge:true});
    SYNC.last = Date.now(); ME.syncErr = null; listenInbox();
  } catch (e) { console.warn('sync', e); ME.syncErr = String(e.code || e.message || e); }
}
function syncSoon(){ clearTimeout(SYNC.soon); SYNC.soon = setTimeout(syncNow, 2500); }

document.addEventListener('visibilitychange', () => { if (ME && ME.classCode) syncNow(); });
async function logEvent(type, data){

  try { const u = await kidAuth(); if (!u) return; await SYNC.db.collection('students').doc(ME.id).collection('events').add({type, data:data || {}, at:TS(), date:dkey()}); } catch (e) { console.warn('event', e); }

async function pushJournal(j){
  if (!ME || !ME.classCode) return;
  try { const u = await kidAuth(); if (!u) return; await SYNC.db.collection('students').doc(ME.id).collection('journal').doc(j.id).set({date:j.date, type:j.type, prompt:j.prompt || '', text:j.text, shared:!!j.shared, at:TS()}); } catch (e) { console.warn('journal', e); }
}
function listenInbox(){
  if (!SYNC.ok || !ME || !ME.classCode || SYNC.inboxFor === ME.id) return;
  if (SYNC.inboxUnsub) SYNC.inboxUnsub();
  SYNC.inboxFor = ME.id;
  SYNC.inboxUnsub = SYNC.db.collection('students').doc(ME.id).collection('inbox').orderBy('at', 'desc').limit(30).onSnapshot(snap => {
    SYNC.inbox = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
    for (const m of SYNC.inbox){
      if (m.type === 'mission' && !m.done && m.mission && !ME.coach.some(c => c.id === m.mission.id)){
        ME.coach.push({id:m.mission.id, t:m.mission.t, d:m.mission.d || '', v:m.mission.v === 'parent' ? 'parent' : 'coach', agr:!!m.mission.agr, steps:(m.mission.steps || []).filter(Boolean).map(t => ({t, done:false})), status:'open'});
        save(); snap.docs.find(d => d.id === m.id).ref.update({done:true, doneAt:TS()}).catch(() => {});
        toast(L('New mission from your coach','Misi baru dari coach'));
      }
      if (m.type === 'confirm' && !m.done){
        const p = ME.pending.find(x => x.pid === m.pid);
        if (p) resolvePending(p);
        snap.docs.find(d => d.id === m.id).ref.update({done:true, doneAt:TS()}).catch(() => {});
      }
    }
    if (!S._typing) render();
  }, e => console.warn('inbox', e));
}
function stopInbox(){ if (SYNC.inboxUnsub) SYNC.inboxUnsub(); SYNC.inboxUnsub = null; SYNC.inboxFor = null; SYNC.inbox = []; }
async function joinClass(code){
  code = String(code || '').trim().toUpperCase();
  if (!/^[A-Z0-9]{4,8}$/.test(code)) return L('Class codes are 4–8 letters or numbers.','Kode kelas berisi 4–8 huruf atau angka.');
  if (!(await fbStart())) return L('Cannot reach the server. Check the internet connection.','Server tidak terjangkau. Periksa koneksi internet.');
  try { const u = await kidAuth(); if (!u) return L('A coach account is signed in on this device. Use another device for players.','Akun coach sedang masuk di perangkat ini. Gunakan perangkat lain untuk pemain.');
    const c = await SYNC.db.collection('classes').doc(code).get(); if (!c.exists) return L('That class code does not exist.','Kode kelas tidak ditemukan.');
    ME.classCode = code; ME.className = c.data().name || code; ME.joined = dkey(); ME.journal.forEach(j => { if (j.synced == null) j.synced = false; }); if (!ME.syncSecret) ME.syncSecret = rid(16); save(); await syncNow(); return null;
  } catch (e) { return L('Could not join: ','Gagal bergabung: ') + (e.code || e.message); }
}
function inboxCard(){
  if (!ME || !ME.classCode) return '';

}

function seenInfo(st){
  const t = st.lastSeen && st.lastSeen.toMillis ? st.lastSeen.toMillis() : 0; if (!t) return {k:'never', label:L('never','belum pernah'), ms:Infinity};
  const ms = Date.now() - t, min = ms / 60000, h = min / 60, d = h / 24;
  if (min < 2 && st.visible !== false) return {k:'online', label:'online', ms};
  if (h < 24) return {k:'today', label: min < 60 ? Math.round(min) + L(' min ago',' mnt lalu') : Math.round(h) + L(' h ago',' jam lalu'), ms};
  return {k: d >= 3 ? 'inactive' : 'recent', label:Math.floor(d) + L(' days ago',' hari lalu'), ms};
}

const topicName = t => { const n = TOPIC_NAMES[t]; return n ? (lang() === 'id' ? n[1] : n[0]) : String(t || '').replace(/-/g, ' ').replace(/^./, c => c.toUpperCase()); };

/* lifetime counters */
function life(){ if (!ME.life) ME.life = {sets:0, correct:0, fixes:0, perfect:0, reviews:0, focus:0, boss:0, quests:0, best:0, comboMax:0, streakMax:ME.streak || 0}; return ME.life; }
function dq(){ const d = day(); if (!d.q) d.q = {sets:0, correct:0, fixes:0, perfect:0, combo:0, review:0, ef:0, focus:0, boss:0, plan:0, claimed:[], chest:false}; return d.q; }

/* ---------- daily quests ---------- */
const QUEST_POOL = [
  {id:'sets2', m:'sets', n:2, en:'Finish 2 practice sets', id_:'Selesaikan 2 set latihan'},
  {id:'correct15', m:'correct', n:15, en:'Get 15 answers right on the first try', id_:'Benar 15 soal di percobaan pertama'},
  {id:'fix2', m:'fixes', n:2, en:'Fix 2 mistakes with a twin question', id_:'Perbaiki 2 kesalahan lewat soal kembar'},
  {id:'combo5', m:'combo', n:5, en:'Get a 5-answer combo', id_:'Dapatkan combo 5 jawaban benar'},
  {id:'perfect', m:'perfect', n:1, en:'Score 9 or 10 out of 10 in a set', id_:'Dapat 9 atau 10 dari 10 dalam satu set'},
  {id:'review', m:'review', n:1, en:'Close the day with an evening review', id_:'Tutup hari dengan review malam'},
  {id:'ef', m:'ef', n:1, en:'Practise this week\'s life skill', id_:'Latih life skill minggu ini'},
  {id:'focus10', m:'focus', n:10, en:'Focus for 10 minutes with the timer', id_:'Fokus 10 menit dengan timer'},
  {id:'plan', m:'plan', n:1, en:'Finish every task in today\'s plan', id_:'Selesaikan semua tugas di rencana hari ini'},
  {id:'sets3', m:'sets', n:3, en:'Finish 3 practice sets', id_:'Selesaikan 3 set latihan'}
];
function todaysQuests(){
  const seed = hashStr(ME.id + dkey()); const pool = QUEST_POOL.filter(q => !(q.id === 'sets3' && ME.grade <= 4));
  const picks = []; let k = seed;
  while (picks.length < 3){ const q = pool[k % pool.length]; if (!picks.includes(q)) picks.push(q); k = Math.imul(k, 1103515245) + 12345 >>> 0; }
  return picks;
}
function questProg(q){ const c = dq(); return Math.min(q.n, c[q.m] || 0); }
function questBump(m, by = 1){ if (!ME) return; const c = dq(); if (m === 'combo') c.combo = Math.max(c.combo || 0, by); else if (m === 'plan') c.plan = by; else c[m] = (c[m] || 0) + by; save(); }
function questsCard(compact){
  const qs = todaysQuests(), c = dq(); const done = qs.filter(q => questProg(q) >= q.n).length;
  return `<div class="card stack-sm"><div class="row between"><span class="label">${L('Daily quests','Quest harian')}</span><span class="tag ${done === 3 ? 'good' : 'info'} num">${done}/3</span></div>

  ${done === 3 && !c.chest ? `<button class="btn block soft" data-a="openChest">${L('Open the daily chest (+15 coins)','Buka peti harian (+15 koin)')}</button>` : c.chest ? `<p class="tiny muted">${L('Chest opened. New quests tomorrow.','Peti sudah dibuka. Quest baru besok.')}</p>` : ''}</div>`;

const goalSets = () => ME.dailyGoal || (ME.grade <= 4 ? 1 : 2);

const TIER = [['Bronze','Perunggu','#C07A45'],['Silver','Perak','#9AA6B2'],['Gold','Emas','#E3B23C']];

function topicOfGen(k){ if (!(k in TOPIC_CACHE)){ try { TOPIC_CACHE[k] = G[k]().topic; } catch (e) { TOPIC_CACHE[k] = null; } } return TOPIC_CACHE[k]; }

function onSetDone(D, c){
  const L_ = life(), q = dq();
  L_.sets++; L_.correct += c; L_.fixes += D.fixOK || 0; L_.best = Math.max(L_.best, Math.round(c / D.n * 10)); L_.comboMax = Math.max(L_.comboMax, D.comboMax || 0);
  q.sets++; q.correct += c; q.fixes += D.fixOK || 0; q.combo = Math.max(q.combo || 0, D.comboMax || 0);
  if (c / D.n >= .9){ L_.perfect++; q.perfect++; }
  if (D.mode === 'boss'){ L_.boss++; q.boss++; }
  /* 85% rule: very easy sets move up faster, hard sets ease off */
  if (!D.placement && D.mode !== 'boss' && D.subj !== 'mix'){ const acc = c / D.n; if (acc >= .95) setLevel(D.subj, .5); else if (acc < .6) setLevel(D.subj, -.5); }
  if (ME.repair && ME.repair.date === dkey() && q.sets >= 2){ ME.streak = ME.repair.prev + 1; ME.repair = null; toast(L('Streak repaired!','Streak dipulihkan!')); }
  classAdd(D.n); save(); achCheck();
}

/* ================= RENDER & BOOT ================= */
function snap(){ const o = {}; document.querySelectorAll('#app input[id], #app textarea[id], #app select[id]').forEach(el => { o[el.id] = el.type === 'checkbox' ? {c:el.checked} : {v:el.value}; }); return o; }
function render(){
  const app = document.getElementById('app');
  const live = (!S._click && S._lastView === S.view) ? snap() : null;
  document.body.classList.toggle('teen', !!ME && ME.grade >= 7);
  document.documentElement.lang = lang();
  let h;
  if (S.route === 'validate') h = vValidate();
  else if (S.view === 'pin') h = vPin(S.pinMode === 'parentConfirm' ? 'parent' : S.pinMode);
  else if (S.view === 'coach') h = vCoach();
  else if (S.view === 'create') h = vCreate();
  else if (!ME) h = vProfiles();
  else if (S.view === 'parent' && !S.unlockedParent){ S.pinMode = 'parent'; h = vPin('parent'); }
  else h = ({home:vHome, checkin:vCheckin, practice:vPractice, drill:vDrill, timer:vTimer, review:vReview, missions:vMissions, choose:vChoose, ef:vEF, quest:vQuest, enq:vEnq, season:vSeason, write:vWrite, coachm:vCoachM, valreq:vValReq, goal:vGoal, skillmap:vSkillMap, room:vRoom, growth:vGrowth, parent:vParent, newEgg:vNewEgg}[S.view] || vHome)();
  app.innerHTML = h + (S.modal ? modalHTML() : '') + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '');
  const keep = S._clear ? null : S._click ? (S.form && S.formView === S.view ? S.form : null) : live; S._clear = false;
  if (keep){ for (const id in keep){ const el = document.getElementById(id); if (!el) continue; if ('c' in keep[id]) el.checked = keep[id].c; else el.value = keep[id].v; } }
  S._lastView = S.view;
}
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('#app textarea, #app input[type=text], #app input:not([type])')) S._typing = true; });
document.addEventListener('focusout', () => { S._typing = false; });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName !== 'A') e.preventDefault();
  S.form = snap(); S.formView = S.view; S._click = true;
  try { const r = fn(el.dataset.v, el); if (r && r.then) r.catch(err => console.error(err)); } catch (err) { console.error(err); toast(L('Something went wrong. Please try again.','Ada yang salah. Coba lagi.')); }
  S._click = false;
});
document.addEventListener('input', e => { if (e.target.id === 'lineIn' && S.drill){ S.drill.line = +e.target.value; const v = document.querySelector('.nval'); if (v){ const q = S.drill.q; const dec = q.step < 1 ? (q.step < .1 ? 2 : 1) : 0; v.textContent = Number(e.target.value).toFixed(dec); } } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'ans'){ e.preventDefault(); S.form = snap(); S.formView = S.view; A.checkInput(); } });

Object.assign(A, SA);
function boot(){
  load();
  const h = (location.hash || '').slice(1);
  if (h.startsWith('v-')){
    const [kind, ref, pid, name] = h.slice(2).split('.');
    if (kind && ref && pid){ S.route = 'validate'; S.val = {kind, ref, pid, name:name || 'your child'}; }
  } else if (h === 'coach'){ S.view = 'coach'; S.pinMode = 'coach'; }
  if (!S.route && S.view !== 'coach' && DB.activeId){ const p = DB.profiles.find(x => x.id === DB.activeId); if (p) enterProfile(p); }
  render();
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h === 'coach' || h.startsWith('v-')){ S.route = null; S.view = 'home'; boot(); } });
boot();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
</script>
